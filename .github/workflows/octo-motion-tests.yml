name: Octo Motion Tests

on:
  push:
    branches:
      - main
      - feature/octo-motion-engine
  pull_request:

jobs:
  motion-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic motion tests
        run: node --test tests/octo-motion.test.mjs

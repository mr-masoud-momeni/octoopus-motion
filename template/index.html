<!doctype html>

<head>

<title>Octoopus · Reel Template 9:16</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  /* ============================================================
     پالت برند — از سایت octoopus.ir استخراج شده
     ============================================================ */
  :root{
    --navy:#0A192F;
    --navy-2:#142B4D;
    --cyan:#41FAF1;
    --muted:#B4BCD0;
    --ink:#000;
    --stage-w:1080;
    --stage-h:1920;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#05080f;
    font-family:"Vazirmatn", system-ui, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }

  /* ---------- صحنه ۱۰۸۰×۱۹۲۰ ---------- */
  #stage{
    position:absolute;
    top:0;left:50%;
    margin-left:calc(var(--stage-w) * -1px / 2);
    width:calc(var(--stage-w) * 1px);
    height:calc(var(--stage-h) * 1px);
    transform-origin:50% 0;
    overflow:hidden;
    background:radial-gradient(120% 80% at 50% 78%, #10233f 0%, var(--navy) 46%, #050c17 100%);
    isolation:isolate;
  }

  /* ---------- پس‌زمینه ---------- */
  .dots{
    position:absolute;inset:-140px;
    background-image:radial-gradient(rgba(65,250,241,.20) 2.4px, transparent 2.4px);
    background-size:64px 64px;
    opacity:.5;
    mask-image:radial-gradient(75% 60% at 50% 55%, #000 0%, transparent 100%);
    -webkit-mask-image:radial-gradient(75% 60% at 50% 55%, #000 0%, transparent 100%);
  }
  .glow{
    position:absolute;left:50%;bottom:-280px;
    width:1500px;height:1100px;margin-left:-750px;
    background:radial-gradient(closest-side, rgba(65,250,241,.22), rgba(65,250,241,.06) 55%, transparent 72%);
    filter:blur(6px);
    pointer-events:none;
  }
  .bubbles{position:absolute;inset:0;overflow:hidden}
  .bubbles i{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(65,250,241,.85), rgba(65,250,241,.10) 70%);
    box-shadow:0 0 18px rgba(65,250,241,.35);
    will-change:transform,opacity;
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(78% 62% at 50% 52%, transparent 40%, rgba(2,6,14,.55) 100%);
    pointer-events:none;
  }

  /* ---------- نوار برند ---------- */
  .brand{
    position:absolute;top:96px;left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:16px;
    font-size:34px;font-weight:500;color:var(--muted);
    letter-spacing:.06em;opacity:.62;direction:ltr;
  }
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan)}

  /* ---------- کارت «خطا» (صحنه ۲) ---------- */
  .card{
    position:absolute;top:556px;left:470px;width:530px;z-index:30;
    border-radius:24px;overflow:hidden;
    background:linear-gradient(180deg,#16233c,#0d1728);
    border:1px solid rgba(65,250,241,.16);
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.3) inset;
    opacity:0;
    will-change:transform,opacity;
  }
  .card-bar{
    display:flex;align-items:center;gap:9px;direction:ltr;
    padding:16px 20px;background:rgba(255,255,255,.04);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .card-bar i{width:12px;height:12px;border-radius:50%;background:#2c3a52;display:block}
  .card-bar i:nth-child(1){background:#ff5f57}
  .card-bar i:nth-child(2){background:#febc2e}
  .card-bar i:nth-child(3){background:#28c840}
  .card-bar span{
    margin-left:auto;font-family:Consolas,monospace;font-size:20px;
    color:#7d8ba3;letter-spacing:.01em;
  }
  .card-body{padding:22px 20px 24px;direction:ltr}
  .card-body .ln{height:11px;border-radius:6px;background:rgba(255,255,255,.10);margin-bottom:12px}
  .card-body .ln.a{width:72%}
  .card-body .ln.b{width:88%}
  .card-body .ln.c{width:45%}
  .card-body .err{
    margin-top:18px;padding:14px 16px;border-radius:12px;
    background:rgba(255,80,80,.10);
    border-left:5px solid #ff5f57;
    font-family:Consolas,monospace;font-size:19px;line-height:1.5;color:#ff8b84;
    direction:ltr;text-align:left;
  }

  /* ---------- کاراکتر ---------- */
  .char{
    position:absolute;top:800px;left:50%;width:780px;
    margin-left:-390px;
    filter:drop-shadow(0 40px 70px rgba(0,0,0,.45)) drop-shadow(0 0 60px rgba(65,250,241,.10));
    will-change:transform;
  }
  .char svg{display:block;width:100%;height:auto;overflow:visible}
  .octo-body{fill:var(--cyan)}
  .octo-ring{fill:#000}
  .octo-pupil{fill:#03080f}
  .octo-shine{fill:#fff}

  /* ---------- متن ---------- */
  .copy{
    position:absolute;top:238px;left:84px;right:84px;z-index:40;
    display:grid;              /* همه صحنه‌ها روی هم می‌نشینند */
  }
  .beat{
    grid-area:1 / 1;
    display:flex;flex-direction:column;align-items:flex-start;
    gap:26px;
  }
  .title{
    font-size:96px;font-weight:900;line-height:1.3;color:#fff;
    text-shadow:0 10px 40px rgba(0,0,0,.45);
    direction:rtl;
  }
  .sub{
    font-size:44px;font-weight:500;line-height:1.6;color:var(--muted);
    direction:rtl;
  }
  /* هر واژه یک اسپن است تا بتوانیم ورود واژه‌به‌واژه بسازیم */
  .w{display:inline-block;will-change:transform,opacity}
  .hl{
    color:var(--cyan);
    position:relative;z-index:0;
  }
  .hl::after{
    content:"";position:absolute;left:-0.02em;right:-0.02em;bottom:0.02em;height:0.045em;
    border-radius:0.03em;
    background:rgba(65,250,241,.85);
    transform:scaleX(var(--u, 0));
    transform-origin:100% 50%;
    z-index:-1;
  }
  /* کلمه‌ای که خودش «صفحهٔ سفید» می‌شود */
  .hl.wblock{
    background:#fff;color:#0A192F;
    border-radius:18px;
    padding:0 .18em;
    margin:0 .03em;
    text-shadow:none;
    box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 20px 46px rgba(0,0,0,.5), 0 0 70px rgba(65,250,241,.22);
  }
  .hl.wblock::after{display:none}
  .chip{
    margin-top:6px;
    display:inline-flex;align-items:center;gap:18px;
    background:var(--cyan);color:#06202c;
    font-size:40px;font-weight:800;
    padding:22px 42px;border-radius:999px;
    box-shadow:0 18px 50px rgba(65,250,241,.28);
    opacity:0;will-change:transform,opacity;
  }
  .chip .ltr{direction:ltr;font-weight:700;letter-spacing:.02em;opacity:.85;font-size:34px}
  .chip svg{width:30px;height:30px}

  /* ---------- جلوه‌ها ---------- */
  .sweep{
    position:absolute;top:0;left:0;right:0;height:9px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    box-shadow:0 0 40px 10px rgba(65,250,241,.35);
    opacity:0;pointer-events:none;z-index:60;
  }

  /* ---------- راهنمای سیف‌زون اینستاگرام ---------- */
  .guides{position:absolute;inset:0;display:none;pointer-events:none}
  .guides.on{display:block}
  .guides .zone{position:absolute;left:0;right:0;border:2px dashed rgba(255,90,90,.45)}
  .guides .zone.top{top:0;height:130px;background:rgba(255,60,60,.06)}
  .guides .zone.bottom{bottom:0;height:430px;background:rgba(255,60,60,.06)}
  .guides .zone .tag{position:absolute;right:16px;bottom:10px;font-size:24px;color:rgba(255,140,140,.8)}

  /* ---------- نوار کنترل (فقط پیش‌نمایش) ---------- */
  #ui{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;background:rgba(8,14,24,.92);
    border-top:1px solid rgba(65,250,241,.18);
    font-size:13px;color:#cfd8e6;direction:ltr;
    font-family:ui-monospace,Consolas,monospace;
  }
  #ui button{
    background:rgba(65,250,241,.12);color:#41FAF1;border:1px solid rgba(65,250,241,.35);
    border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;
  }
  #ui button:hover{background:rgba(65,250,241,.22)}
  #ui input[type=range]{flex:1;accent-color:#41FAF1;height:4px}
  #ui label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  #ui .time{min-width:120px;text-align:center;color:#7f8ea6}
</style>
</head>

<script>
/* =====================================================================
   OCTOOPUS · REEL TEMPLATE
   کل انیمیشن یک تابع خالص از زمان است: draw(t) — هیچ stateی نگه
   نمی‌داریم. به همین دلیل می‌توانیم فریم‌به‌فریم (مثلاً ۳۰fps) رندر
   کنیم و خروجی کاملاً یکسان بگیریم.
   ===================================================================== */

const RENDER = new URLSearchParams(location.search).has("render");
const params = new URLSearchParams(location.search);

/* ---------------------------------------------------------------------
   ۱) تنظیمات — اینجا را برای ساخت ریلز بعدی عوض کن
   --------------------------------------------------------------------- */
const CFG = {
  duration: 6.0,   // ثانیه
  fps: 30,

  // بالا آمدن اکتو از اعماق
  rise: { start: 0.05, dur: 0.95, from: 980 },

  // پلک زدن (ثانیه‌های مطلق)
  blinks: [1.15, 1.62, 2.72, 3.30, 4.62, 5.18, 5.62],

  // صحنه‌ها. [[...]] = کلمه‌ای که فیروزه‌ای می‌شود
  beats: [
    {
      t0: 0.00, t1: 2.00,
      title: "سایتت {{سفید}} شده؟",
      sub: "قبل هر کاری این [[مسیر]] رو برو.",
      mouth: "surprise",
      gaze: [0.0, -0.15],   // -1..1  افقی / عمودی
      sweep: false
    },
    {
      t0: 2.00, t1: 4.00,
      title: "۹۹٪ وقت‌ها [[پلاگین]]ه",
      sub: "نه هاست، نه سرور",
      mouth: "sad",
      gaze: [0.55, -0.85],
      sweep: true
    },
    {
      t0: 4.00, t1: 6.00,
      title: "بذار [[بررسیش]] کنم",
      sub: "پروژه‌ت رو تحلیل می‌کنم، رایگان",
      mouth: "happy",
      gaze: [0.0, 0.0],
      sweep: true,
      chip: "مشاوره رایگان"
    }
  ]
};

/* ---------------------------------------------------------------------
   ۲) ابزارهای ریاضی
   --------------------------------------------------------------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, start, dur) => clamp((t - start) / dur);
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eInCubic = t => t * t * t;
const eOutExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const eInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eOutBack = (t, s = 1.35) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

// شبه‌تصادفی قطعی (برای حباب‌ها)
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------------------------------------------------------------
   ۳) گرفتن المان‌ها
   --------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const el = {
  dots: $("#dots"), glow: $("#glow"), char: $("#charInner"),
  eyeL: $("#eyeL"), eyeR: $("#eyeR"), pupilL: $("#pupilL"), pupilR: $("#pupilR"),
  mHappy: $("#mHappy"), mSad: $("#mSad"), mSurprise: $("#mSurprise"),
  legs: { LL: $("#legLL"), LM: $("#legLM"), RM: $("#legRM"), RL: $("#legRL") },
  card: $("#card"), chip: null, copy: $("#copy"), sweep: $("#sweep"),
  bubbles: $("#bubbles")
};

/* ---------------------------------------------------------------------
   ۴) ساخت متن‌ها (واژه‌به‌واژه)
   --------------------------------------------------------------------- */
function segments(text) {
  const out = [];
  text.split(/(\[\[.+?\]\]|\{\{.+?\}\})/g).filter(Boolean).forEach(part => {
    const block = part.startsWith("{{");
    const hl = block || part.startsWith("[[");
    const clean = hl ? part.slice(2, -2) : part;
    clean.split(/\s+/).filter(Boolean).forEach(w => out.push({ w, hl, block }));
  });
  return out;
}

function buildLine(parent, text, cls) {
  const d = document.createElement("div");
  d.className = cls;
  d.style.opacity = 0;
  segments(text).forEach(({ w, hl, block }) => {
    const s = document.createElement("span");
    s.className = "w" + (hl ? " hl" : "") + (block ? " wblock" : "");
    s.textContent = w;
    s.style.opacity = 0;
    d.appendChild(s);
    d.appendChild(document.createTextNode(" "));
  });
  parent.appendChild(d);
  return d;
}

CFG.beats.forEach((b, i) => {
  const box = document.createElement("div");
  box.className = "beat";
  el.copy.appendChild(box);
  b._box = box;
  b._title = buildLine(box, b.title, "title");
  b._sub = buildLine(box, b.sub, "sub");
  b._words = [...b._title.querySelectorAll(".w"), ...b._sub.querySelectorAll(".w")];
  b._hlBars = [...box.querySelectorAll(".hl")];
  b._titleLen = b._title.querySelectorAll(".w").length;
});

// چیپ CTA
const chipBeat = CFG.beats.findIndex(b => b.chip);
if (chipBeat > -1) {
  const c = document.createElement("div");
  c.className = "chip";
  c.innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
     <span>${CFG.beats[chipBeat].chip}</span>
     <span class="ltr">octoopus.ir</span>`;
  CFG.beats[chipBeat]._box.appendChild(c);
  el.chip = c;
}

/* ---------------------------------------------------------------------
   ۵) حباب‌ها
   --------------------------------------------------------------------- */
const BUBBLES = [];
(function makeBubbles() {
  const r = rng(20260119);
  for (let i = 0; i < 16; i++) {
    const node = document.createElement("i");
    const size = lerp(8, 34, r());
    node.style.width = size + "px";
    node.style.height = size + "px";
    el.bubbles.appendChild(node);
    BUBBLES.push({
      node,
      x: lerp(40, 1040, r()),
      y0: lerp(0, 2100, r()),
      speed: lerp(45, 150, r()),
      wob: lerp(12, 48, r()),
      phase: r() * Math.PI * 2,
      alpha: lerp(0.10, 0.42, r())
    });
  }
})();

/* ---------------------------------------------------------------------
   ۶) رندر هر فریم
   --------------------------------------------------------------------- */
const CX = 212.6, CY = 471.93;          // محور چرخش/فشردگی کاراکتر (پایین‌وسط)
const EYE = { L: [114.81, 157.74], R: [302.82, 157.74] };

function mouthWeights(t) {
  // crossfade بین حالت‌های دهان در شروع هر صحنه
  const w = { happy: 0, sad: 0, surprise: 0 };
  let idx = 0;
  for (let i = 0; i < CFG.beats.length; i++) if (t >= CFG.beats[i].t0) idx = i;
  const cur = CFG.beats[idx];
  const p = clamp((t - cur.t0) / 0.1);
  w[cur.mouth] = p;
  if (idx > 0) w[CFG.beats[idx - 1].mouth] += 1 - p;
  return w;
}

function gazeAt(t) {
  let idx = 0;
  for (let i = 0; i < CFG.beats.length; i++) if (t >= CFG.beats[i].t0) idx = i;
  const cur = CFG.beats[idx];
  if (idx === 0) return cur.gaze;
  const p = eInOutCubic(clamp((t - cur.t0) / 0.45));
  const prev = CFG.beats[idx - 1].gaze;
  return [lerp(prev[0], cur.gaze[0], p), lerp(prev[1], cur.gaze[1], p)];
}

function blinkAt(t) {
  let sy = 1;
  for (const bt of CFG.blinks) {
    const p = (t - bt) / 0.16;
    if (p > 0 && p < 1) sy = Math.min(sy, 1 - 0.94 * Math.sin(Math.PI * p));
  }
  return sy;
}

function draw(t) {
  t = Math.max(0, t);

  /* --- پس‌زمینه --- */
  el.dots.style.transform = `translate(${Math.sin(t * 0.25) * 14}px, ${-t * 10}px)`;
  el.glow.style.transform = `scale(${1 + Math.sin(t * 1.15) * 0.02})`;
  el.glow.style.opacity = 0.85 + Math.sin(t * 1.15) * 0.15;

  for (const b of BUBBLES) {
    const y = 2100 - (((b.y0 + t * b.speed) % 2300));
    const x = b.x + Math.sin(t * 1.1 + b.phase) * b.wob;
    b.node.style.transform = `translate(${x}px, ${y}px)`;
    b.node.style.opacity = b.alpha * (0.55 + 0.45 * Math.sin(t * 1.6 + b.phase));
  }

  /* --- کاراکتر: بالا آمدن + تنفس + فشردگی --- */
  const riseP = prog(t, CFG.rise.start, CFG.rise.dur);
  const riseY = lerp(CFG.rise.from, 0, eOutBack(riseP, 1.05));
  const breath = Math.sin(t * 1.85) * 5;
  const landAt = CFG.rise.start + CFG.rise.dur * 0.82;
  const squash = 0.075 * Math.sin(Math.PI * prog(t, landAt, 0.4));
  const sy = (1 - squash) * (1 + Math.sin(t * 1.85) * 0.006);
  const sx = 1 + squash * 0.55;

  el.char.setAttribute("transform",
    `translate(0 ${riseY + breath}) translate(${CX} ${CY}) scale(${sx} ${sy}) translate(${-CX} ${-CY})`);

  /* --- بازوها --- */
  const swayAmp = 1.4 + (1 - riseP) * 5;
  const legs = [
    ["LL", 0, -1], ["LM", 0.6, -1], ["RM", 1.2, 1], ["RL", 1.8, 1]
  ];
  for (const [key, phase, dir] of legs) {
    const a = Math.sin(t * 2.1 + phase) * swayAmp * dir;
    el.legs[key].setAttribute("transform",
      `rotate(${a.toFixed(2)} ${key === "LL" ? 31.89 : key === "LM" ? 152.34 : key === "RM" ? 272.93 : 393.3} 308.65)`);
  }

  /* --- چشم‌ها: نگاه + پلک --- */
  const g = gazeAt(t);
  const gx = g[0] * 9, gy = g[1] * 7;
  el.pupilL.setAttribute("transform", `translate(${gx.toFixed(2)} ${gy.toFixed(2)})`);
  el.pupilR.setAttribute("transform", `translate(${gx.toFixed(2)} ${gy.toFixed(2)})`);
  const bsy = blinkAt(t);
  for (const [k, c] of [["eyeL", EYE.L], ["eyeR", EYE.R]]) {
    el[k].setAttribute("transform",
      `translate(${c[0]} ${c[1]}) scale(1 ${bsy.toFixed(3)}) translate(${-c[0]} ${-c[1]})`);
  }

  /* --- دهان --- */
  const mw = mouthWeights(t);
  el.mHappy.style.opacity = mw.happy;
  el.mSad.style.opacity = mw.sad;
  el.mSurprise.style.opacity = mw.surprise;

  /* --- متن صحنه‌ها --- */
  CFG.beats.forEach(b => {
    const inDur = 0.5, outDur = 0.3;
    const pIn = eOutExpo(prog(t, b.t0, inDur));
    const pOut = prog(t, b.t1 - outDur, outDur);
    const alpha = pIn * (1 - eInCubic(pOut));
    const shift = lerp(48, 0, pIn) + lerp(0, -34, eInCubic(pOut));

    if (alpha <= 0.001) {
      b._title.style.opacity = 0; b._sub.style.opacity = 0;
      b._words.forEach(w => { w.style.opacity = 0; });
      return;
    }

    b._title.style.opacity = alpha;
    b._sub.style.opacity = alpha;
    b._title.style.transform = `translateY(${shift}px)`;

    b._words.forEach((w, i) => {
      const isSub = i >= b._titleLen;
      const p = eOutExpo(clamp((t - b.t0 - 0.04 - i * 0.055) / 0.42));
      const flk = w.classList.contains("wblock")
        ? (1 - 0.05 * Math.abs(Math.sin(t * 37.1 + 9.3)))
        : 1;
      w.style.opacity = p * flk;
      w.style.transform = `translateY(${lerp(46, 0, p)}px) scale(${lerp(0.94, 1, p)})`;
      w.style.filter = p < 0.98 ? `blur(${lerp(6, 0, p).toFixed(2)}px)` : "none";
      if (isSub) w.style.opacity = p * 0.92;
    });

    // هایلایت: خط فیروزه‌ای زیر کلمه
    b._hlBars.forEach((h, i) => {
      const p = eOutCubic(clamp((t - b.t0 - 0.42 - i * 0.07) / 0.45));
      h.style.setProperty("--u", p.toFixed(3));
    });

    // CTA
    if (b.chip && el.chip) {
      const p = clamp((t - b.t0 - 0.55) / 0.42);
      const e = eOutBack(p, 1.9);
      el.chip.style.opacity = clamp(p * 1.6);
      el.chip.style.transform = `translateY(${lerp(24, 0, p)}px) scale(${lerp(0.82, 1, e)})`;
    }
  });

  /* --- کارت خطا --- */
  const cb = CFG.beats[1];
  if (cb) {
    const p = clamp((t - cb.t0 - 0.1) / 0.55);
    const out = prog(t, cb.t1 - 0.25, 0.25);
    const e = eOutBack(p, 1.4);
    el.card.style.opacity = clamp(p * 2) * (1 - out);
    el.card.style.transform =
      `translateX(${lerp(340, 0, e)}px) rotate(${lerp(-14, -5, e)}deg) scale(${lerp(0.9, 1, e)})`;
  }

  /* --- خط اسکن در شروع صحنه --- */
  let sweepOp = 0, sweepY = -60;
  for (const b of CFG.beats) {
    if (!b.sweep) continue;
    const p = prog(t, b.t0 - 0.05, 0.45);
    if (p > 0 && p < 1) {
      sweepY = lerp(-40, 1960, eInOutCubic(p));
      sweepOp = Math.sin(Math.PI * p) * 0.75;
    }
  }
  el.sweep.style.transform = `translateY(${sweepY}px)`;
  el.sweep.style.opacity = sweepOp;
}

/* ---------------------------------------------------------------------
   ۷) پخش / پیش‌نمایش
   --------------------------------------------------------------------- */
window.renderAt = draw;
window.OCTO_META = { duration: CFG.duration, fps: CFG.fps, width: 1080, height: 1920 };
window.__ready = false;

if (RENDER) {
  document.getElementById("ui").style.display = "none";
  const tf = params.get("t");
  draw(tf ? parseFloat(tf) : 0);
  if (params.has("guides")) document.getElementById("guides").classList.add("on");
  document.fonts.ready.then(() => { window.__ready = true; });
} else {
  // مقیاس‌دهی صحنه به اندازه پنجره
  const stage = document.getElementById("stage");
  const fit = () => {
    const s = Math.min(window.innerWidth / 1080, (window.innerHeight - 56) / 1920);
    stage.style.transform = `scale(${s})`;
  };
  fit();
  window.addEventListener("resize", fit);

  const playBtn = document.getElementById("playBtn");
  const scrub = document.getElementById("scrub");
  const timeLbl = document.getElementById("timeLbl");
  scrub.max = CFG.duration;

  let playing = true, t0 = performance.now(), offset = 0;

  const tick = (now) => {
    if (playing) {
      offset = ((now - t0) / 1000) % CFG.duration;
      scrub.value = offset;
    }
    draw(offset);
    timeLbl.textContent = offset.toFixed(2) + "s";
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    if (playing) t0 = performance.now() - offset * 1000;
  };
  scrub.oninput = () => {
    offset = parseFloat(scrub.value);
    if (playing) t0 = performance.now() - offset * 1000;
  };
  document.getElementById("restartBtn").onclick = () => {
    offset = 0; t0 = performance.now();
  };
  document.getElementById("guideChk").onchange = (e) => {
    document.getElementById("guides").classList.toggle("on", e.target.checked);
  };
  document.fonts.ready.then(() => { window.__ready = true; });
}
</script>
</body>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octo Motion — سلام من اکتو هستم</title>
<style>
*{box-sizing:border-box}
:root{--aqua:#41faf2;--ink:#06152b;--octo-font:"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif}
html,body{margin:0;min-height:100%;background:var(--ink);color:#f4fbff;font-family:var(--octo-font)}
body{display:grid;place-items:center;min-height:100vh}
#scene{position:relative;width:min(100vw,720px);height:min(177.78vw,1280px);max-height:100vh;aspect-ratio:9/16;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#12334b 0%,#0a2039 42%,#06152b 100%)}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#41faf21f 1px,transparent 1px),linear-gradient(90deg,#41faf21f 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(transparent,black 25%,black 75%,transparent)}
.glow{position:absolute;width:85%;aspect-ratio:1;left:7.5%;top:25%;border-radius:50%;background:radial-gradient(circle,#41faf224,transparent 68%);filter:blur(10px)}
.brand{position:absolute;top:6%;width:100%;text-align:center;font:700 18px sans-serif;letter-spacing:5px;color:#e0f6ff8f}
.depth{position:absolute;top:10%;left:7%;direction:ltr;font:12px monospace;letter-spacing:2px;color:#41faf2a6;border-left:2px solid var(--aqua);padding-left:12px}
#octo{position:absolute;width:56%;left:22%;top:34%;opacity:0;transform:translateY(70%);transform-origin:50% 80%;filter:drop-shadow(0 24px 26px #0004);will-change:transform,opacity}
#octo svg{display:block;width:100%;height:auto;overflow:visible;shape-rendering:geometricPrecision}
#octo #R-pupil,#octo #L-pupil,#octo #R-B-Light,#octo #R-L-Light,#octo #L-B-Light,#octo #L-L-Light{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#octo #R-Leg,#octo #R-M-Leg,#octo #L-M-Leg,#octo #L-Leg{transform-box:fill-box;transform-origin:50% 0%;will-change:transform}
#octo #mouth{transform-box:fill-box;transform-origin:center;will-change:transform}
#message{position:absolute;left:9.4%;top:14%;width:81.2%;min-height:160px;padding:28px 30px;border:1px solid #41faf278;border-radius:26px;background:linear-gradient(135deg,#122f45f0,#091d33f0);box-shadow:0 16px 55px #0004;opacity:0;transform:translateY(20px)}
.kicker{font-size:15px;color:var(--aqua);margin-bottom:16px;font-weight:700}
#typed{font-size:clamp(20px,4.8vw,35px);line-height:1.75;font-weight:700;min-height:115px;text-align:right;white-space:pre-wrap}
#cursor{display:inline-block;width:3px;height:1em;background:var(--aqua);vertical-align:middle;margin-right:5px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#subline{position:absolute;bottom:7.5%;width:100%;text-align:center;color:#d7f0ff85;opacity:0}
@media(min-width:721px){#scene{height:min(100vh,1280px);width:calc(min(100vh,1280px)*.5625)}}
</style></head>
<body><main id="scene"><div class="glow"></div><div class="grid"></div>
<div class="brand">OCTOOPUS <span style="color:#41faf2">/</span> DEEP WEB</div><div class="depth">DEPTH 0042 M<br><span style="opacity:.6">SIGNAL FOUND</span></div>
<div id="message"><div class="kicker">یک پیام از اعماق دریا</div><div id="typed"></div><span id="cursor"></span></div>
<div id="octo" aria-label="شخصیت اکتو"></div>
<div id="subline">هشت بازو؛ یک ذهن کنجکاو</div></main>
<script>
const FULL='سلام من اکتو هستم یک توسعه‌دهنده در اعماق!';
const octo=document.querySelector('#octo'),msg=document.querySelector('#message'),typed=document.querySelector('#typed'),cursor=document.querySelector('#cursor'),sub=document.querySelector('#subline');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return 1-Math.pow(1-v,3)};
const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
let svgReady=false;
fetch('octoopus-character.svg').then(r=>{if(!r.ok)throw Error('SVG load failed');return r.text()}).then(s=>{octo.innerHTML=s;svgReady=true;}).catch(e=>{octo.textContent='SVG لود نشد؛ فایل index.html و SVG را کنار هم نگه دار.';console.error(e)});
function setTransform(id,value){const el=octo.querySelector('#'+id);if(el)el.setAttribute('transform',value)}
window.renderAt=function(t){
 const rise=ease((t-.25)/1.7),entry=clamp((t-.12)/.45);
 const bob=t>1.5?Math.sin((t-1.5)*1.55)*7+Math.sin(t*3.1)*1.5:0;
 const lean=t>1.5?Math.sin(t*1.2)*1.15:0;
 octo.style.opacity=String(entry);
 octo.style.transform='translate3d(0,'+((1-rise)*510+bob)+'px,0) scale('+(0.965+.035*rise)+') rotate('+lean+'deg)';
 const m=ease((t-1.8)/.65);msg.style.opacity=String(m);msg.style.transform='translateY('+((1-m)*20)+'px)';
 const chars=Array.from(FULL),count=Math.max(0,Math.min(chars.length,Math.floor((t-2.55)/.105)));
 typed.textContent=chars.slice(0,count).join('');
 cursor.style.opacity=t>2.55&&t<2.55+chars.length*.105+.2?'1':'0';
 sub.style.opacity=String(ease((t-9.35)/.55));
 if(svgReady){
   // Small gaze shifts, timed to the entrance and text, rather than a fixed stare.
   const gx=t<1.2?0:(Math.sin(t*.82)*5+(t>2.2&&t<2.8?-4:0));
   const gy=t<1.2?1:Math.sin(t*1.17)*3;
   for(const [id,x,y] of [['R-pupil',gx,gy],['R-B-Light',gx,gy],['R-L-Light',gx,gy],['L-pupil',gx,gy],['L-B-Light',gx,gy],['L-L-Light',gx,gy]])setTransform(id,'translate('+x+' '+y+')');
   // Blink briefly, with a natural irregular cadence.
   const blinkPulse=(a,b,t)=>Math.max(0,1-Math.abs(t-(a+b)/2)/((b-a)/2));
   const blink=Math.max(blinkPulse(3.9,4.08,t),blinkPulse(7.15,7.34,t),blinkPulse(8.7,8.9,t));
   const eyes=octo.querySelector('#eyes');if(eyes)eyes.style.transform='scaleY('+(1-.88*blink)+')';
   // Tentacles lag behind the body with different phases.
   for(const [id,amp,phase] of [['L-Leg',5,.2],['L-M-Leg',4,1.6],['R-M-Leg',4,2.5],['R-Leg',5,3.4]]){
     const el=octo.querySelector('#'+id);if(el)el.setAttribute('transform','rotate('+(Math.sin(t*2.15+phase)*amp)+' '+(id==='L-Leg'?31:id==='L-M-Leg'?151:id==='R-M-Leg'?273:393)+' 315)');
   }
   const talking=t>2.55&&t<2.55+chars.length*.105;
   const mouth=octo.querySelector('#mouth');
   if(mouth){
     // A soft, syllable-like open/close envelope; not a simple fixed-rate toggle.
     const phase=(t-2.55)*Math.PI*2*3.25;
     const envelope=talking?Math.pow(Math.max(0,Math.sin(phase)+.12),1.35)*(0.34+0.66*Math.abs(Math.sin((t-2.55)*2.2))):0;
     mouth.style.transform='scaleY('+(1+envelope*.7)+')';
     mouth.style.transformOrigin='212px 272px';
   }
 }
};
window.renderAt(0);const start=performance.now();
function play(now){const t=(now-start)/1000;window.renderAt(Math.min(t,10));if(t<10)requestAnimationFrame(play)}
requestAnimationFrame(play);
</script></body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رتبه اول گوگل با ضمانت؟ | Octoopus</title>
<style>
@font-face{font-family:Vazirmatn;src:url("../../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--cyan:#41FAF1;--white:#F3F8FF}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:#050d1b;color:var(--white);font-family:Vazirmatn,sans-serif;-webkit-font-smoothing:antialiased}
#poster{position:absolute;left:0;top:0;transform-origin:top left;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 85% 55% at 50% 48%,rgba(25,76,105,.55),transparent 72%),linear-gradient(145deg,#071629,#0A192F 52%,#061326)}
#poster:before{content:"";position:absolute;inset:0;opacity:.18;background-image:radial-gradient(rgba(65,250,241,.3) 1.3px,transparent 1.3px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%)}
.glow{position:absolute;width:760px;height:760px;left:160px;top:570px;border-radius:50%;background:rgba(65,250,241,.09);filter:blur(110px)}
.url{position:absolute;top:205px;left:150px;right:150px;text-align:center;font:800 25px/1.4 Arial,sans-serif;letter-spacing:1.4px;color:var(--cyan);direction:ltr}
.rule{position:absolute;top:275px;left:170px;right:170px;height:2px;background:linear-gradient(90deg,transparent,rgba(65,250,241,.48),transparent)}
.copy{position:absolute;left:145px;right:145px;top:355px;bottom:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:42px;text-align:center}
h1{width:100%;margin:0;font-size:59px;line-height:1.55;font-weight:900;letter-spacing:-1px;color:#fff}
h1 span,.highlight{color:var(--cyan)}
.message{width:100%;margin:0;text-align:center;font-size:39px;line-height:1.95;font-weight:450;color:#EAF2FC;text-wrap:pretty}
.message strong{color:var(--cyan);font-weight:800}
.cta{margin-top:8px;padding:19px 32px;border:1.5px solid rgba(65,250,241,.55);border-radius:22px;background:linear-gradient(120deg,rgba(65,250,241,.13),rgba(17,48,76,.7));box-shadow:0 0 30px rgba(65,250,241,.08);font-size:34px;line-height:1.75;font-weight:800;color:#fff}
.cta span{color:var(--cyan)}
</style>
</head>
<body>
<main id="poster">
 <div class="glow"></div>
 <div class="url">octoopus.ir</div>
 <div class="rule"></div>
 <section class="copy">
  <h1>رتبه اول گوگل رو<br><span>بهت تضمین می‌دم!</span></h1>
  <p class="message">هرکس چنین ضمانتی می‌ده، یا سئو رو نمی‌شناسه یا داره گمراهت می‌کنه!</p>
  <p class="message">هیچ‌کس نمی‌تونه جایگاه گوگل رو تضمین کنه. سئو یه فرآیند <strong>پیچیده و مستمره</strong>، نه یه وعده تبلیغاتی!</p>
  <div class="cta">دنبال رشد واقعی سایتتی؟<br><span>سئوی اصولی رو به اکتوپوس بسپار!</span></div>
 </section>
</main>
<script>
function fitPoster(){const p=document.getElementById('poster');const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);p.style.transform=`scale(${scale})`;p.style.left=`${(window.innerWidth-1080*scale)/2}px`;p.style.top=`${(window.innerHeight-1920*scale)/2}px`}
fitPoster();window.addEventListener('resize',fitPoster);document.fonts.ready.then(()=>{window.__ready=true});window.OCTO_META={duration:1};window.renderAt=()=>{};
</script>
</body>
</html>

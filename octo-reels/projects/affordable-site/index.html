<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وردپرس درد نمی‌خوره؟ | Octoopus</title>
<style>
@font-face{font-family:Vazirmatn;src:url("../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--cyan:#41FAF1;--white:#F3F8FF;--muted:#B4BCD0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:#050d1b;color:var(--white);font-family:Vazirmatn,sans-serif;-webkit-font-smoothing:antialiased}
#poster{position:absolute;left:0;top:0;transform-origin:top left;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 85% 55% at 50% 48%,rgba(25,76,105,.55),transparent 72%),linear-gradient(145deg,#071629,#0A192F 52%,#061326)}
#poster:before{content:"";position:absolute;inset:0;opacity:.18;background-image:radial-gradient(rgba(65,250,241,.3) 1.3px,transparent 1.3px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%)}
.glow{position:absolute;width:760px;height:760px;left:160px;top:570px;border-radius:50%;background:rgba(65,250,241,.09);filter:blur(110px)}
.url{position:absolute;top:265px;left:90px;right:90px;text-align:center;font:800 25px/1.4 Arial,sans-serif;letter-spacing:1.4px;color:var(--cyan);direction:ltr}
.rule{position:absolute;top:335px;left:90px;right:90px;height:2px;background:linear-gradient(90deg,transparent,rgba(65,250,241,.48),transparent)}
.copy{position:absolute;left:90px;right:90px;top:520px;bottom:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:66px;text-align:center}
h1{width:100%;margin:0;text-align:center;font-size:62px;line-height:1.55;font-weight:850;color:var(--white);letter-spacing:-1px}
h1 span{color:var(--cyan)}
.message{width:100%;max-width:900px;margin:0;text-align:center;font-size:44px;line-height:1.95;font-weight:400;color:#EAF2FC;text-wrap:pretty}
.message .highlight{color:var(--cyan);font-weight:500}
</style>
</head>
<body>
<main id="poster">
 <div class="glow"></div>
 <div class="url">octoopus.ir</div>
 <div class="rule"></div>
 <section class="copy">
  <h1><span>وردپرس درد نمی‌خوره؟!</span></h1>
  <div class="message">برتری یک: یه صفحه‌ساز مثل المنتور داره که تقریباً هر چیزی رو می‌تونی باهاش بسازی؛ از صفحه فرود و سایت شرکتی تا صفحات فروشگاهی، فرم‌ها، فیلتر محصولات و بخش‌های تعاملی. حتی می‌تونی ظاهر سایتت رو خودت تغییر بدی، بدون اینکه برای هر اصلاح کوچیکی برنامه‌نویس بخوای.</div>
 </section>
</main>
<script>
function fitPoster(){const p=document.getElementById('poster');const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);p.style.transform=`scale(${scale})`;p.style.left=`${(window.innerWidth-1080*scale)/2}px`;p.style.top=`${(window.innerHeight-1920*scale)/2}px`}
fitPoster();window.addEventListener('resize',fitPoster);document.fonts.ready.then(()=>{window.__ready=true});window.OCTO_META={duration:1};window.renderAt=()=>{};
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وردپرس درد نمی‌خوره؟! | Octoopus</title><style>
@font-face{font-family:Vazirmatn;src:url("../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--cyan:#41FAF1;--white:#F3F8FF;--muted:#D0D9E8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:#050d1b;color:var(--white);font-family:Vazirmatn,sans-serif;-webkit-font-smoothing:antialiased}
#poster{position:absolute;left:0;top:0;transform-origin:top left;width:1080px;height:1920px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 90% 60% at 50% 48%,rgba(25,76,105,.62),transparent 72%),linear-gradient(145deg,#071629,#0A192F 52%,#061326)}
#poster:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.2;background-image:radial-gradient(rgba(65,250,241,.3) 1.3px,transparent 1.3px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%)}
.glow{position:absolute;width:850px;height:850px;left:115px;top:520px;border-radius:50%;background:rgba(65,250,241,.10);filter:blur(115px);z-index:-1}
.brand{position:absolute;top:155px;left:100px;right:100px;text-align:center;font:800 31px/1.4 Arial,sans-serif;letter-spacing:2px;color:var(--cyan);direction:ltr}
.rule{position:absolute;top:225px;left:145px;right:145px;height:2px;background:linear-gradient(90deg,transparent,rgba(65,250,241,.55),transparent)}
.copy{position:absolute;left:90px;right:90px;top:290px;bottom:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:38px;text-align:center}
h1{width:100%;margin:0;font-size:78px;line-height:1.45;font-weight:900;letter-spacing:-1.5px;color:#fff}
h1 span{color:var(--cyan)}
.sub{width:100%;max-width:850px;margin:0;color:#EAF2FC;font-size:43px;line-height:1.9;font-weight:500;text-wrap:pretty}
.sub strong{color:var(--cyan);font-weight:800}
.feature{width:88%;min-height:190px;padding:26px 30px;display:flex;align-items:center;justify-content:center;gap:22px;border:2px solid rgba(65,250,241,.65);border-radius:26px;background:linear-gradient(135deg,rgba(65,250,241,.13),rgba(17,48,76,.88) 58%,rgba(65,250,241,.07));box-shadow:0 0 32px rgba(65,250,241,.10),inset 0 0 22px rgba(65,250,241,.04)}
.feature .number{flex:0 0 76px;width:76px;height:76px;display:grid;place-items:center;border-radius:20px;background:var(--cyan);color:#061326;font-size:48px;line-height:1;font-weight:900;box-shadow:0 0 22px rgba(65,250,241,.22)}
.feature>span:nth-child(2){font-size:46px;line-height:1.5;font-weight:800;color:#fff;white-space:nowrap}
.blocks{flex:0 0 58px;width:58px;height:58px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}
.blocks i{display:block;border:2px solid var(--cyan);border-radius:6px;background:rgba(65,250,241,.18)}
.blocks i:nth-child(2),.blocks i:nth-child(3){background:var(--cyan);box-shadow:0 0 10px rgba(65,250,241,.25)}
.bottom-url{position:absolute;bottom:145px;left:100px;right:100px;text-align:center;font:800 27px/1.4 Arial,sans-serif;letter-spacing:1.8px;color:var(--cyan);direction:ltr;opacity:.95}
</style></head>
<body><main id="poster"><div class="glow"></div><div class="brand">OCTOOPUS.IR</div><div class="rule"></div><section class="copy">
<h1><span>وردپرس درد نمی‌خوره؟!</span></h1>

<div class="feature"><span class="number">۱</span><span>صفحه‌ساز قدرتمند</span><span class="blocks"><i></i><i></i><i></i><i></i></span></div>
</section><div class="bottom-url">octoopus.ir</div></main>
<script>
function fitPoster(){const p=document.getElementById('poster');const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);p.style.transform=`scale(${scale})`;p.style.left=`${(window.innerWidth-1080*scale)/2}px`;p.style.top=`${(window.innerHeight-1920*scale)/2}px`}
fitPoster();window.addEventListener('resize',fitPoster);document.fonts.ready.then(()=>{window.__ready=true});window.OCTO_META={duration:1};window.renderAt=()=>{};
</script></body></html>

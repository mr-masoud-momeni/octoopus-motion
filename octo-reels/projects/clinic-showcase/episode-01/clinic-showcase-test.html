<title>Octoopus | Clinic Showcase Test</title>
<style>
@font-face{font-family:Vazirmatn;src:url("../../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--navy:#07182d;--cyan:#41FAF1;--muted:#b4bfd0;--ink:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#030914;color:var(--ink);font-family:Vazirmatn,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;overflow:hidden;isolation:isolate;transform-origin:center;background:radial-gradient(ellipse at 52% 60%,#17395a 0%,#091c34 52%,#030914 100%)}
#stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#41faf10a 1px,transparent 1px),linear-gradient(90deg,#41faf10a 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);opacity:.22}

.brand{position:absolute;top:48px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:13px;direction:ltr;color:#b4bfd0;font:600 27px system-ui;letter-spacing:.07em;opacity:.8;z-index:10}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan)}
.kicker{position:absolute;top:112px;left:0;right:0;text-align:center;color:#8eabc2;font-size:22px;letter-spacing:.02em;z-index:8}
#laptop{position:absolute;left:50%;top:185px;width:960px;height:675px;transform:translateX(-50%);z-index:4;filter:drop-shadow(0 38px 42px #0009);will-change:transform,opacity}
.lid{position:absolute;inset:0 0 95px;padding:15px;border-radius:27px 27px 18px 18px;background:linear-gradient(145deg,#718296,#1b2b3e 22%,#0c1726 78%,#53677c);border:2px solid #8194a7;box-shadow:inset 0 0 0 1px #ffffff25,inset 0 0 22px #0008}
.lid:before{content:"";position:absolute;top:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#0a111b;z-index:3}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:12px;background:#e9f2f1;box-shadow:inset 0 0 0 1px #0008}
#page{display:block;width:100%;height:auto;max-width:none;transform:translateY(0);transform-origin:top center;will-change:transform}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff2,transparent 24%,transparent 78%,#41faf110)}
.base{position:absolute;left:-22px;right:-22px;bottom:0;height:96px;clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);border-radius:0 0 28px 28px;background:linear-gradient(180deg,#c6d0da 0%,#718398 13%,#25384d 42%,#0e1c2c 100%);border:1px solid #9aa9b8;box-shadow:inset 0 2px 2px #fff8}
.base:before{content:"";position:absolute;left:37%;right:37%;top:8px;height:8px;border-radius:0 0 12px 12px;background:#26394d}
.base:after{content:"";position:absolute;left:15%;right:15%;bottom:10px;height:2px;background:#ffffff18;border-radius:50%}
#introTitle{position:absolute;top:895px;left:95px;right:95px;text-align:center;z-index:7;opacity:0;transform:translateY(20px);font-size:45px;line-height:1.6;font-weight:900}
#introTitle b{color:var(--cyan)}
#info{position:absolute;top:895px;left:105px;right:105px;min-height:245px;display:flex;align-items:center;gap:24px;padding:34px 38px;border:1px solid #41faf15a;border-radius:25px;background:linear-gradient(115deg,#0b2038f5,#123452f2);box-shadow:0 24px 65px #0005;z-index:7;opacity:0;transform:translateY(24px)}
#info .num{display:grid;place-items:center;flex:0 0 72px;height:72px;border-radius:22px;background:#41faf11c;color:var(--cyan);font-size:29px;font-weight:900}
#info .copy{flex:1}#info h2{font-size:37px;color:var(--cyan);margin-bottom:10px}#info p{font-size:27px;line-height:1.9;color:#e0e9f3}
#octoWrap{position:absolute;right:95px;bottom:125px;width:300px;opacity:0;z-index:8;filter:drop-shadow(0 22px 28px #0007);transform-origin:50% 100%;will-change:transform}
#octo{display:block;width:100%;height:auto;overflow:visible}.octo-body{fill:#41FAF1}.octo-ring{fill:#000}.octo-pupil{fill:#03080f}.octo-shine{fill:#fff}
#closing{position:absolute;left:85px;right:390px;bottom:285px;text-align:right;font-size:47px;line-height:1.65;font-weight:900;opacity:0;z-index:8}
#closing b{color:var(--cyan)}
#closing small{display:block;font-size:25px;color:#b4bfd0;font-weight:500;margin-top:14px}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#050c18f2;border-top:1px solid #41faf133;color:#cbd5e1;font:13px ui-monospace,Consolas,monospace;direction:ltr}
button{background:#102a43;color:var(--cyan);border:1px solid #41faf155;border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
#scrub{flex:1;accent-color:var(--cyan)}#time{min-width:72px;text-align:center}
</style>

<div id="closing">یک وب‌سایت خوب،<br><b>اعتماد را از اولین نگاه می‌سازد.</b><small>از طرف تیم اُکتو · octoopus.ir</small></div>
</div>
<div id="controls"><button id="play">Play</button><button id="restart">Restart</button><input id="scrub" type="range" min="0" max="32" step=".01" value="0"><span id="time">0.00s</span></div>
<script>
(()=> {
 const D=32,$=id=>document.getElementById(id),stage=$("stage"),page=$("page"),screen=$("screen"),laptop=$("laptop"),octo=$("octoWrap"),info=$("info"),intro=$("introTitle"),closing=$("closing");
 const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,p)=>a+(b-a)*p,ease=p=>{p=clamp(p);return p*p*(3-2*p)},out=p=>1-Math.pow(1-clamp(p),3),ramp=(t,a,b)=>ease((t-a)/(b-a));
 const limbs=[["legLL",31.89],["legLM",152.34],["legRM",272.93],["legRL",393.3]].map(([id,x])=>({node:$(id),x}));
 const pupils=[$("pupilL"),$("pupilR")],eyes=[$("eyeL"),$("eyeR")];
 let playing=false,time=0,raf=0,start=0,pageHeight=0,screenHeight=0,ready=false;
 const panels=[
  {a:3.4,b:8.2,num:"01",title:"هدر؛ معرفی در چند ثانیه",text:"نام و هویت کلینیک، منوی اصلی و راه ارتباطی؛ همه‌چیز از همان ابتدای ورود در دسترس است.",scroll:0,gaze:[.05,-.18],pose:"welcome"},
  {a:8.2,b:13.2,num:"02",title:"خدمات؛ مسیر روشن برای مراجعه‌کننده",text:"محتوا و دسته‌بندی خدمات کمک می‌کنند مخاطب سریع‌تر چیزی را که دنبالش است پیدا کند.",scroll:.25,gaze:[.12,-.12],pose:"explain"},
  {a:13.2,b:18.2,num:"03",title:"جزئیات؛ پاسخ به سؤال‌های مهم",text:"اطلاعات دقیق و چیدمان منظم، تصمیم‌گیری را ساده‌تر و تجربهٔ کاربر را مطمئن‌تر می‌کند.",scroll:.49,gaze:[.08,-.08],pose:"curious"},
  {a:18.2,b:23.2,num:"04",title:"دعوت به اقدام؛ قدم بعدی مشخص است",text:"وقتی راه تماس یا دریافت مشاوره واضح باشد، کاربر راحت‌تر از بازدیدکننده به مراجعه‌کننده تبدیل می‌شود.",scroll:.72,gaze:[.15,-.18],pose:"invite"},
  {a:23.2,b:28,num:"05",title:"پایان صفحه؛ راه‌های ارتباطی",text:"اطلاعات تماس و دسترسی‌های تکمیلی، مسیر ارتباط را کامل می‌کنند.",scroll:.94,gaze:[.04,-.05],pose:"calm"}
 ];
 function measure(){screenHeight=screen.clientHeight;pageHeight=page.naturalWidth?page.naturalHeight*(screen.clientWidth/page.naturalWidth):0}
 function draw(t){
  time=Math.max(0,Math.min(D,Number(t)||0));
  const fit=Math.min(innerWidth/1080,(innerHeight-48)/1920);stage.style.transform="scale("+fit+")";
  const introIn=out(ramp(time,.25,1.1)),introOut=1-ramp(time,3,3.6);
  laptop.style.opacity=out(ramp(time,.15,1.25));
  laptop.style.transform="translateX(-50%) translateY("+lerp(48,0,out(ramp(time,.15,1.5)))+"px) scale("+lerp(.965,1,out(ramp(time,.15,1.5)))+")";
  intro.style.opacity=introIn*introOut;intro.style.transform="translateY("+lerp(22,0,introIn)+"px)";
  const active=panels.find(p=>time>=p.a&&time<p.b);
  if(active){
   const q=ramp(time,active.a,active.a+.75),fadeOut=1-ramp(time,active.b-.45,active.b);
   const maxScroll=Math.max(0,pageHeight-screenHeight),target=maxScroll*active.scroll;
   const idx=panels.indexOf(active),prev=panels[idx-1],from=prev?maxScroll*prev.scroll:0;
   page.style.transform="translateY("+(-lerp(from,target,q))+"px)";
   $("num").textContent=active.num;$("infoTitle").textContent=active.title;$("infoText").textContent=active.text;
   const reveal=out(ramp(time,active.a+.12,active.a+.72))*fadeOut;
   info.style.opacity=reveal;info.style.transform="translateY("+lerp(25,0,out(ramp(time,active.a+.12,active.a+.72)))+"px)";
  }else if(time<panels[0].a){page.style.transform="translateY(0px)";info.style.opacity=0}
  else if(time>=panels[panels.length-1].b){page.style.transform="translateY("+(-Math.max(0,pageHeight-screenHeight)*panels[panels.length-1].scroll)+"px)";info.style.opacity=0}
  const endFade=1-ramp(time,30.7,31.6),octoIn=out(ramp(time,1.1,2.1));
  octo.style.opacity=octoIn*endFade;
  const pose=active?active.pose:"welcome";
  const bob=Math.sin(time*1.35)*4+Math.sin(time*.63)*2;
  const lean=pose==="curious"?-2.2:pose==="invite"?1.6:pose==="explain"?.8:0;
  octo.style.transform="translate3d(0,"+bob+"px,0) rotate("+lean+"deg)";
  const base=pose==="explain"?[-13,-5,7,17]:pose==="curious"?[-18,-8,15,23]:pose==="invite"?[-8,-15,18,8]:pose==="calm"?[-5,-2,7,12]:[-8,-4,6,10];
  limbs.forEach((l,i)=>{const wave=Math.sin(time*1.75+i*.95)*2.3+Math.sin(time*.8+i*1.2)*1.1;l.node.setAttribute("transform","rotate("+(base[i]+wave)+" "+l.x+" 308.65)")});
  const gaze=active?active.gaze:[.04,-.12],gx=gaze[0]*7+Math.sin(time*.65)*.8,gy=gaze[1]*6+Math.sin(time*.9)*.5;
  pupils.forEach(p=>p.setAttribute("transform","translate("+gx+" "+gy+")"));
  const blinkTimes=[2.6,6.9,11.4,16.1,21.4,26.3,29.5];let blink=1;
  for(const bt of blinkTimes){const q=(time-bt)/.17;if(q>0&&q<1)blink=Math.min(blink,1-.94*Math.sin(Math.PI*q))}
  eyes.forEach((e,i)=>{const x=i?302.82:114.81;e.setAttribute("transform","translate("+x+" 157.74) scale(1 "+blink+") translate("+(-x)+" -157.74)")});
  $("mSurprise").style.opacity=time<3.2?.9:pose==="curious"?.35:0;
  $("mHappy").style.opacity=pose==="welcome"||time>28?1:.85;
  $("mSad").style.opacity=0;
  const close=out(ramp(time,28.1,29.2));closing.style.opacity=close;closing.style.transform="translateY("+lerp(24,0,close)+"px)";
  $("scrub").value=time;$("time").textContent=time.toFixed(2)+"s";
 }
 window.renderAt=draw;
 window.OCTO_META={duration:D,fps:30,width:1080,height:1920};
 window.OCTO_EVENTS=[{name:"whoosh",t:.2},{name:"pop",t:3.4},{name:"sweep",t:8.2},{name:"pop",t:13.2},{name:"sweep",t:18.2},{name:"pop",t:23.2},{name:"ding",t:28.8}];
 function readyCheck(){if(page.complete&&page.naturalWidth){measure();ready=true;window.__ready=true;draw(0)}else page.addEventListener("load",()=>{measure();ready=true;window.__ready=true;draw(0)},{once:true})}
 document.fonts.ready.then(readyCheck);readyCheck();
 function tick(){if(!playing)return;const t=Math.min(D,(performance.now()-start)/1000);draw(t);if(t>=D){playing=false;$("play").textContent="Play";return}raf=requestAnimationFrame(tick)}
 $("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Play";if(playing){start=performance.now()-time*1000;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};
 $("restart").onclick=()=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(0)};
 $("scrub").oninput=e=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(+e.target.value)};
 addEventListener("resize",()=>{measure();draw(time)});draw(0);
})();
</script>
</body></html>

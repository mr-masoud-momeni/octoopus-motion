<!doctype html>

<style>
@font-face{font-family:Vazirmatn;src:url("../../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--navy:#0A192F;--cyan:#41FAF1;--teal:#05BDB7;--deep:#104F4D;--cream:#F4F7FB;--muted:#B4BCD0}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{background:#030914;color:var(--cream);font-family:Vazirmatn,sans-serif;-webkit-font-smoothing:antialiased}

.brand{position:absolute;top:65px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;direction:ltr;font:600 28px/1.2 system-ui;color:#b4bfd1;opacity:.72}.brand i{width:10px;height:10px;background:var(--cyan);border-radius:50%;box-shadow:0 0 18px var(--cyan)}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;z-index:2;opacity:0}
.episode{font-size:27px;color:var(--muted);font-weight:800;margin-bottom:35px;letter-spacing:.04em}
h1{font-size:112px;line-height:1.32;font-weight:1000;letter-spacing:-.055em;text-shadow:0 12px 34px #0005}
h1 span{display:block}h1 b{color:var(--cyan);font-weight:1000}
.rule{width:230px;height:4px;margin-top:35px;border-radius:5px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.subline{margin-top:28px;color:#b4bfd0;font-size:31px;font-weight:700}
#monitor{position:absolute;left:50%;top:500px;width:920px;height:850px;transform:translateX(-50%) perspective(1800px) rotateY(-7deg) rotateX(1deg) scale(.8);opacity:0;z-index:3;filter:drop-shadow(0 42px 55px #0009);transform-origin:center}
.frame{position:absolute;inset:0 0 45px;border-radius:30px;background:linear-gradient(145deg,#35465b,#081321);border:9px solid #26394f;padding:15px;box-shadow:inset 0 0 0 2px #ffffff22}
.screen{height:100%;width:100%;overflow:hidden;border-radius:12px;background:#e8f7f5;position:relative}
.screen img{display:block;width:100%;height:auto;max-width:none;transform:translateY(0);will-change:transform}
.stand{position:absolute;bottom:0;left:50%;width:150px;height:45px;transform:translateX(-50%);background:linear-gradient(90deg,#18283c,#64758a,#17283c);clip-path:polygon(34% 0,66% 0,78% 100%,22% 100%)}
.base{position:absolute;bottom:0;left:50%;width:290px;height:13px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(90deg,#1b2b3e,#718196,#1b2b3e)}
.monitor-glow{position:absolute;inset:15px;border-radius:12px;box-shadow:inset 0 0 70px #05bdb722;pointer-events:none}
.caption{position:absolute;top:245px;left:70px;right:70px;text-align:center;font-size:48px;line-height:1.55;font-weight:900;opacity:0;z-index:5;text-shadow:0 10px 35px #0007}
.caption em{font-style:normal;color:var(--cyan)}
#octoWrap{position:absolute;left:50%;top:1050px;width:490px;margin-left:-245px;opacity:0;transform:translate3d(250px,180px,0) scale(.72);transform-origin:50% 100%;filter:drop-shadow(0 34px 48px #0007) drop-shadow(0 0 30px #41faf120);z-index:6;will-change:transform,opacity}
#octo{display:block;width:100%;height:auto;overflow:visible}.octo-body{fill:#41FAF1}.octo-ring{fill:#000}.octo-pupil{fill:#03080f}.octo-shine{fill:#fff}
.bubble{position:absolute;right:370px;top:1120px;padding:17px 25px;border-radius:22px;background:#f4ffff;color:#08243a;border:2px solid var(--teal);font-size:27px;font-weight:900;box-shadow:0 16px 42px #0006;opacity:0;z-index:7}
#end{position:absolute;left:80px;right:80px;top:1460px;text-align:center;font-size:57px;line-height:1.5;font-weight:900;opacity:0;z-index:4}
#end b{color:var(--cyan)}
#controls{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#050c18f2;border-top:1px solid #41faf133;font:13px ui-monospace,Consolas,monospace;color:#cbd5e1;direction:ltr}
#controls button{background:#102a43;color:var(--cyan);border:1px solid #41faf155;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
#scrub{flex:1;accent-color:var(--cyan)}#time{min-width:75px;text-align:center}
</style></head><body><div id="stage">

          <g id="pupilR">

</div>
<div id="controls"><button id="play">Play</button><button id="restart">Restart</button><input id="scrub" type="range" min="0" max="34" step=".01" value="0"><span id="time">0.00s</span></div>
<script>
(()=>{
const DURATION=34, $=s=>document.querySelector(s), id=s=>document.getElementById(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>{p=clamp(p);return p*p*(3-2*p)}, out=p=>1-Math.pow(1-clamp(p),3), prog=(t,a,d)=>clamp((t-a)/d);
const cover=id("cover"),monitor=id("monitor"),octo=id("octoWrap"),caption=id("caption"),bubble=id("bubble"),end=id("end"),shot=id("siteShot"),stage=id("stage");
const limbs=[["legLL",31.89,0,-1],["legLM",152.34,1.4,-1],["legRM",272.93,2.8,1],["legRL",393.3,4.2,1]].map(([n,x,p,d])=>({node:id(n),x,phase:p,dir:d}));
const pupils=[id("pupilL"),id("pupilR")],eyes=[id("eyeL"),id("eyeR")];
let FIT=1,playing=false,offset=0,start=0,raf=0;
function show(el,p,transform){el.style.opacity=p.toFixed(3);if(transform)el.style.transform=transform}
function draw(input){
 const t=clamp(Number(input)||0,0,DURATION);
 id("grid").style.transform="translate3d("+Math.sin(t*.15)*13+"px,"+(-t*5)+"px,0)";
 const cp=out(prog(t,0,.75))*(1-prog(t,4.1,.45));
 show(cover,cp,"translateY("+lerp(34,0,out(prog(t,0,.9)))+"px)");
 const mp=out(prog(t,4.15,1.35));
 show(monitor,mp,"translateX(-50%) perspective(1800px) rotateY(-7deg) rotateX(1deg) scale("+lerp(.78,1,mp)+")");
 const scroll=lerp(0,Math.max(0,shot.scrollHeight-shot.parentElement.clientHeight),ease(prog(t,8,20)));
 shot.style.transform="translateY("+(-scroll)+"px)";
 let text="",p=0;
 const cues=[
 [7,12.5,"ترکیب رنگی؛ <em>آرامش‌بخش و قابل اعتماد</em>"],
 [13,18.5,"خدمات مهم، <em>در دسترس و واضح</em>"],
 [19,24.5,"نمایش امکانات، بدون شلوغی"],
 [25,29.5,"یک تجربه ساده برای <em>مراجعه‌کننده</em>"]
 ];
 for(const [a,b,s] of cues)if(t>=a&&t<b){text=s;p=out(prog(t,a,.5))*(1-prog(t,b-.45,.45));break}
 caption.innerHTML=text;show(caption,p,"translateY("+lerp(25,0,p)+"px)");
 const entry=out(prog(t,1.4,1.05)),float=Math.sin(t*1.2)*5,breath=Math.sin(t*1.5)*.006;
 let x=0,y=0,scale=.64;
 if(t<5){x=340;y=210;scale=.62}
 else if(t<13){x=335;y=110;scale=.60}
 else if(t<19){x=-340;y=115;scale=.59}
 else if(t<25){x=340;y=105;scale=.59}
 else{x=0;y=110;scale=.58}
 const intro=out(prog(t,1.3,1.1));
 const active=out(prog(t,5.0,.7));
 const octoOpacity=out(prog(t,1.35,.45))*(1-prog(t,33,.5));
 show(octo,octoOpacity,"translate3d("+lerp(460,x,intro)+"px,"+(lerp(280,y,intro)+float+lerp(100,0,active))+"px,0) scale("+scale*(1+breath)+")");
 // بازوها مستقل و موجی؛ هر کدام فاز و دامنه متفاوت دارند
 const amp=t<5?1.0:t<13?1.35:t<19?1.7:t<25?1.25:.8;
 limbs.forEach((l,i)=>{const wave=Math.sin(t*2.0+l.phase)*2.5*amp;const fine=Math.sin(t*3.1+l.phase)*.65;l.node.setAttribute("transform","rotate("+((wave+fine)*l.dir).toFixed(2)+" "+l.x+" 308.65)")});
 // نگاه اکتو به مانیتور و سپس جزئیات
 const gaze=t<8?[.65,-.25]:t<13?[.9,-.2]:t<19?[-.8,-.25]:t<25?[.8,-.2]:[0,0];
 pupils.forEach(p=>p.setAttribute("transform","translate("+(gaze[0]*8)+" "+(gaze[1]*7)+")"));
 let blink=1;for(const bt of [4.8,8.1,11.7,15.3,19.6,23.4,27.5,31.2]){const q=(t-bt)/.16;if(q>0&&q<1)blink=Math.min(blink,1-.94*Math.sin(Math.PI*q))}
 eyes.forEach((e,i)=>{const c=i?[302.82,157.74]:[114.81,157.74];e.setAttribute("transform","translate("+c[0]+" "+c[1]+") scale(1 "+blink+") translate("+(-c[0])+" "+(-c[1])+")")});
 const surprise=t>5&&t<8, happy=t>=13;
 id("mSurprise").style.opacity=surprise?1:0;id("mSad").style.opacity=0;id("mHappy").style.opacity=happy||!surprise?1:0;
 const bp=out(prog(t,5.6,.4))*(1-prog(t,8.8,.35));show(bubble,bp,"scale("+lerp(.82,1,bp)+")");
 const ep=out(prog(t,30,.8));show(end,ep,"translateY("+lerp(35,0,ep)+"px)");
 stage.style.transform="scale("+FIT+")";
}
window.renderAt=draw;window.OCTO_META={duration:DURATION,fps:30,width:1080,height:1920};
window.OCTO_EVENTS=[{name:"rise",t:1.55},{name:"pop",t:4.2},{name:"whoosh",t:5.1},{name:"pop",t:7.05},{name:"sweep",t:13},{name:"pop",t:19},{name:"ding",t:25.1},{name:"whoosh",t:30}];
window.__ready=false;
Promise.all([document.fonts.ready,new Promise(resolve=>{if(shot.complete&&shot.naturalWidth)resolve();else shot.onload=resolve;})]).then(()=>{window.__ready=true;draw(offset)});
const fit=()=>{FIT=Math.min(innerWidth/1080,(innerHeight-54)/1920);draw(offset)};fit();addEventListener("resize",fit);
function tick(now){if(playing){offset=Math.min(DURATION,(now-start)/1000);id("scrub").value=offset;draw(offset);id("time").textContent=offset.toFixed(2)+"s";if(offset>=DURATION){playing=false;id("play").textContent="Play";return}}raf=requestAnimationFrame(tick)}
id("play").onclick=()=>{playing=!playing;id("play").textContent=playing?"Pause":"Play";if(playing){start=performance.now()-offset*1000;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};
id("restart").onclick=()=>{playing=false;offset=0;cancelAnimationFrame(raf);draw(0);id("play").textContent="Play"};
id("scrub").oninput=e=>{playing=false;cancelAnimationFrame(raf);offset=+e.target.value;draw(offset);id("time").textContent=offset.toFixed(2)+"s";id("play").textContent="Play"};
draw(0);
})();
</script></body></html>

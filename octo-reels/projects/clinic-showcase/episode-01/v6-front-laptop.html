<script>(()=>{const D=35,$=id=>document.getElementById(id),stage=$("stage"),screen=$("screen"),page=$("page"),octo=$("octoWrap"),info=$("info"),closing=$("closing");
const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,p)=>a+(b-a)*p,ease=p=>{p=clamp(p);return p*p*(3-2*p)},out=p=>1-Math.pow(1-clamp(p),3),ramp=(t,a,b)=>ease((t-a)/(b-a));
const limbs=[["legLL",31.89],["legLM",152.34],["legRM",272.93],["legRL",393.3]].map(([id,x])=>({node:$(id),x}));
const pupils=[$("pupilL"),$("pupilR")],eyes=[$("eyeL"),$("eyeR")];
let playing=false,time=0,raf=0,start=0,pageHeight=0,screenHeight=0;
const panels=[
{a:0,b:6.5,num:"01",title:"هدر؛ شروع یک تجربه مطمئن",text:"لوگو، منوی روشن و راه تماس سریع؛ کاربر از همان ابتدا می‌داند کجاست و چطور باید ادامه دهد.",scroll:0,pose:"point",gaze:[.2,-.25]},
{a:6.5,b:13,num:"02",title:"مزیت‌ها؛ پاسخ به نیاز بیمار",text:"مزیت‌های کلینیک با آیکون و توضیح کوتاه کنار هم آمده‌اند تا ارزش خدمات سریع فهمیده شود.",scroll:.265,pose:"explain",gaze:[.15,-.2]},
{a:13,b:19.5,num:"03",title:"خدمات تخصصی؛ انتخاب ساده‌تر",text:"دسته‌بندی خدمات و نمایش جزئیات، پیدا کردن گزینه مناسب را برای مراجعه‌کننده آسان می‌کند.",scroll:.465,pose:"react",gaze:[.1,-.1]},
{a:19.5,b:26,num:"04",title:"مشاوره آنلاین؛ دعوت به اقدام",text:"بنر برجسته و دکمه مشخص، قدم بعدی را واضح می‌کنند: شروع مشاوره با پزشک.",scroll:.69,pose:"point",gaze:[.25,-.2]},
{a:26,b:32,num:"05",title:"فوتر؛ دسترسی بدون سردرگمی",text:"راه‌های تماس، لینک‌های خدمات و دسترسی سریع در پایان صفحه یک‌جا جمع شده‌اند.",scroll:.855,pose:"think",gaze:[.1,-.05]}
];function draw(t){
 time=Math.max(0,Math.min(D,Number(t)||0));const fit=Math.min(innerWidth/1080,(innerHeight-48)/1920);stage.style.transform="scale("+fit+")";
 const active=panels.find(p=>time>=p.a&&time<p.b);
 if(active){
  const q=ramp(time,active.a,active.a+.65),fadeOut=1-ramp(time,active.b-.55,active.b);
  const targetScroll=Math.max(0,pageHeight-screenHeight)*active.scroll;
  const prev=panels[panels.indexOf(active)-1];
  const fromScroll=prev?Math.max(0,pageHeight-screenHeight)*prev.scroll:0;
  const scrollPx=lerp(fromScroll,targetScroll,q);
  page.style.transform="translateY("+(-scrollPx)+"px)";
  $("num").textContent=active.num;$("infoTitle").textContent=active.title;$("infoText").textContent=active.text;
  info.style.opacity=out(ramp(time,active.a+.12,active.a+.7))*fadeOut;
  info.style.transform="translateY("+lerp(30,0,out(ramp(time,active.a+.12,active.a+.7)))+"px)";
 }else if(time<panels[0].a){page.style.transform="translateY(0px)";info.style.opacity=0}
 else {page.style.transform="translateY("+(-Math.max(0,pageHeight-screenHeight)*panels[panels.length-1].scroll)+"px)";info.style.opacity=0}
 const op=out(ramp(time,.2,1.3))*(1-ramp(time,33.5,34.5));octo.style.opacity=op;
 const phase=active?panels.indexOf(active):-1;
 // Octo acts as a presenter: looks at the laptop, gestures toward it, then turns back to the viewer.
 const bob=Math.sin(time*1.5)*3.5;
 const pose=active?active.pose:"intro";
 octo.style.transform="translate3d(0,"+bob+"px,0) rotate("+ (pose==="explain"?-2:pose==="react"?2:0)+"deg) scale(1)";
 const angles=pose==="point"?[-22,-8,16,28]:pose==="explain"?[-34,-12,10,25]:pose==="react"?[-38,-26,24,38]:pose==="think"?[-8,-28,30,12]:[-12,-5,7,12];
 limbs.forEach((l,i)=>{const pulse=Math.sin(time*2.4+i*.9)*1.5;const v=angles[i]+pulse;l.node.setAttribute("transform","rotate("+v+" "+l.x+" 308.65)")});
 const gaze=active?active.gaze:[.05,-.05];pupils.forEach(p=>p.setAttribute("transform","translate("+(gaze[0]*7)+" "+(gaze[1]*6)+")"));
 const blinkTimes=[2.7,6.2,11.8,17.7,23.5,29.4,32.4];let blink=1;for(const bt of blinkTimes){const q=(time-bt)/.16;if(q>0&&q<1)blink=Math.min(blink,1-.94*Math.sin(Math.PI*q))}
 eyes.forEach((e,i)=>{const x=i?302.82:114.81;e.setAttribute("transform","translate("+x+" 157.74) scale(1 "+blink+") translate("+(-x)+" -157.74)")});
 $("mSurprise").style.opacity=pose==="react"?.95:0;$("mHappy").style.opacity=pose==="intro"||time>30?1:pose==="react"?.25:1;$("mSad").style.opacity=0;
 const end=out(ramp(time,33.5,34.5));closing.style.opacity=end;closing.style.transform="translateY("+lerp(24,0,end)+"px)";
 $("scrub").value=time;$("time").textContent=time.toFixed(2)+"s";
}
window.renderAt=draw;window.OCTO_META={duration:D,fps:30,width:1080,height:1920};window.OCTO_EVENTS=[{name:"whoosh",t:.2},{name:"pop",t:6.5},{name:"sweep",t:13},{name:"pop",t:19.5},{name:"sweep",t:26},{name:"ding",t:33.8}];const measurePage=()=>{screenHeight=screen.clientHeight;pageHeight=page.naturalWidth?page.naturalHeight*(screen.clientWidth/page.naturalWidth):0};const ready=()=>{if(page.complete&&page.naturalWidth){measurePage();draw(0)}else page.addEventListener("load",()=>{measurePage();draw(0)},{once:true})};document.fonts.ready.then(ready);ready();
function tick(){if(!playing)return;const t=Math.min(D,(performance.now()-start)/1000);draw(t);if(t>=D){playing=false;$("play").textContent="Play";return}raf=requestAnimationFrame(tick)}
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Play";if(playing){start=performance.now()-time*1000;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};
$("restart").onclick=()=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(0)};
$("scrub").oninput=e=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(+e.target.value)};
addEventListener("resize",()=>{measurePage();draw(time)});draw(0);})();</script></body></html>

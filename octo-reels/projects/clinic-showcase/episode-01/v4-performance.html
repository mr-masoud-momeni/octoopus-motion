<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octoopus | Clinic Showcase V3</title>
<style>
@font-face{font-family:Vazirmatn;src:url("../../../template/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:block}

#cover .eyebrow{font-size:28px;color:var(--muted);font-weight:800;margin-bottom:30px}
#cover h1{font-size:112px;line-height:1.34;font-weight:1000;letter-spacing:-.05em;text-shadow:0 12px 40px #0006}
#cover h1 span{display:block}#cover h1 b{color:var(--cyan)}
#cover .line{width:230px;height:4px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);margin:32px 0 24px}
#cover .sub{font-size:33px;color:#b9c8d9;font-weight:700}
#monitor{position:absolute;left:50%;top:420px;width:930px;height:1030px;transform:translateX(-50%) perspective(1800px) rotateY(-5deg) scale(.9);opacity:0;z-index:3;filter:drop-shadow(0 42px 60px #0009)}
.frame{position:absolute;inset:0 0 46px;padding:17px;border:9px solid #293d53;border-radius:28px;background:linear-gradient(145deg,#354960,#091523);box-shadow:inset 0 0 0 2px #ffffff20}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:12px;background:#e9f5f4;display:flex;justify-content:center;align-items:flex-start}
#page{display:block;width:100%;height:auto;max-width:none;transform-origin:top center;will-change:transform;transform:translateZ(0)}
.screen.overview #page{width:auto;height:100%;max-width:100%;object-fit:contain}
.screen.overview{align-items:center}
.stand{position:absolute;bottom:0;left:50%;width:165px;height:46px;transform:translateX(-50%);background:linear-gradient(90deg,#17283c,#708096,#17283c);clip-path:polygon(34% 0,66% 0,78% 100%,22% 100%)}
.base{position:absolute;bottom:0;left:50%;width:300px;height:13px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(90deg,#1b2b3e,#718196,#1b2b3e)}

#info{position:absolute;left:75px;right:75px;top:1500px;min-height:180px;display:flex;align-items:center;gap:24px;padding:26px 32px;border:1px solid #41faf155;border-radius:22px;background:linear-gradient(110deg,#0b2038ee,#102e49ee);box-shadow:0 20px 55px #0005;opacity:0;z-index:7}
#info .num{display:grid;place-items:center;flex:0 0 62px;height:62px;border-radius:18px;background:#41faf11c;color:var(--cyan);font-size:27px;font-weight:900}
#info .copy{flex:1}#info h2{font-size:34px;color:var(--cyan);margin-bottom:8px}#info p{font-size:25px;line-height:1.8;color:#e0e9f3}
#octoWrap{position:absolute;left:58px;bottom:115px;width:285px;opacity:0;z-index:8;filter:drop-shadow(0 22px 28px #0007);transform-origin:50% 100%;will-change:transform}
#octo{display:block;width:100%;height:auto;overflow:visible}.octo-body{fill:#41FAF1}.octo-ring{fill:#000}.octo-pupil{fill:#03080f}.octo-shine{fill:#fff}
#closing{position:absolute;left:80px;right:80px;top:1510px;text-align:center;font-size:54px;line-height:1.5;font-weight:900;opacity:0;z-index:8}#closing b{color:var(--cyan)}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#050c18f2;border-top:1px solid #41faf133;color:#cbd5e1;font:13px ui-monospace,Consolas,monospace;direction:ltr}
button{background:#102a43;color:var(--cyan);border:1px solid #41faf155;border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}#scrub{flex:1;accent-color:var(--cyan)}#time{min-width:72px;text-align:center}
</style></head><body><div id="stage">

<div id="closing">طراحی خوب،<br><b>اعتماد رو از اولین نگاه می‌سازه.</b></div>
</div>
<div id="controls"><button id="play">Play</button><button id="restart">Restart</button><input id="scrub" type="range" min="0" max="35" step=".01" value="0"><span id="time">0.00s</span></div>
<script>
(()=>{
const D=35,$=id=>document.getElementById(id),stage=$("stage"),screen=$("screen"),page=$("page"),monitor=$("monitor"),cover=$("cover"),octo=$("octoWrap"),info=$("info"),focus=$("focus"),closing=$("closing");
const clamp=(v)=>Math.max(0,Math.min(1,v)),lerp=(a,b,p)=>a+(b-a)*p,ease=p=>{p=clamp(p);return p*p*(3-2*p)},out=p=>1-Math.pow(1-clamp(p),3),ramp=(t,a,b)=>ease((t-a)/(b-a));
const limbs=[["legLL",31.89,0,-1],["legLM",152.34,1.4,-1],["legRM",272.93,2.8,1],["legRL",393.3,4.2,1]].map(([id,x,phase,dir])=>({node:$(id),x,phase,dir}));
const pupils=[$("pupilL"),$("pupilR")],eyes=[$("eyeL"),$("eyeR")];
let scale=1,playing=false,time=0,raf=0,start=0,pageHeight=0,screenHeight=0;
const panels=[
 {a:7,b:13,num:"01",title:"هدر؛ اولین نقطه تماس",text:"لوگو، مسیرهای اصلی و راه ارتباطی؛ واضح و در دسترس.",scroll:0,zoom:1.7,fx:.50,fy:.10,fw:.88,fh:.20,gaze:[.2,-.3]},
 {a:13,b:19,num:"02",title:"پیام اصلی صفحه",text:"تیتر روشن و تصویر پزشک؛ قبل از هر چیز، حس اعتماد می‌سازند.",scroll:.12,zoom:1.85,fx:.50,fy:.34,fw:.86,fh:.34,gaze:[.4,-.2]},
 {a:19,b:25,num:"03",title:"خدمات و نوبت‌دهی",text:"مراجعه‌کننده باید سریع بفهمد چه خدمتی می‌گیرد و چطور نوبت رزرو کند.",scroll:.43,zoom:1.8,fx:.50,fy:.60,fw:.9,fh:.26,gaze:[.1,-.25]},
 {a:25,b:30,num:"04",title:"جزئیات تکمیلی",text:"چیدمان منظم، مسیر حرکت کاربر را ساده‌تر می‌کند.",scroll:.68,zoom:1.65,fx:.5,fy:.78,fw:.88,fh:.2,gaze:[.35,-.15]}
];
function setInfo(p,alpha){$("num").textContent=p.num;$("infoTitle").textContent=p.title;$("infoText").textContent=p.text;info.style.opacity=alpha;info.style.transform="translateY("+lerp(24,0,alpha)+"px)"}
function draw(t){
 time=Math.max(0,Math.min(D,Number(t)||0));const fit=Math.min(innerWidth/1080,(innerHeight-48)/1920);scale=fit;stage.style.transform="scale("+fit+")";
 const c=1-ramp(time,4.25,5.0);cover.style.opacity=c;cover.style.transform="translateY("+lerp(0,-32,ramp(time,4.0,4.9))+"px)";
 const m=ramp(time,4.2,5.7);monitor.style.opacity=m;monitor.style.transform="translateX(-50%) perspective(1800px) rotateY(-5deg) scale("+lerp(.88,1,m)+")";
 const active=panels.find(p=>time>=p.a&&time<p.b);
 let zoom=1,scroll=0;
 if(time<7){screen.classList.add("overview");page.style.transform="scale(1) translateY(0)";focus.style.opacity=0;info.style.opacity=0}
 else if(active){
  screen.classList.remove("overview");
  const q=ramp(time,active.a,active.a+.9),settle=ramp(time,active.b-.7,active.b);
  zoom=lerp(1,active.zoom,q);scroll=active.scroll;
  const scrollPx=Math.max(0,pageHeight-screenHeight)*scroll;
  page.style.transform="translateY("+(-scrollPx)+"px) scale("+zoom+")";
  focus.style.left=(50-active.fw/2)+"%";focus.style.top=(active.fy*100)+"%";focus.style.width=(active.fw*100)+"%";focus.style.height=(active.fh*100)+"%";
  focus.style.opacity=out(ramp(time,active.a+.65,active.a+1.05))*(1-ramp(time,active.b-.55,active.b));
  setInfo(active,out(ramp(time,active.a+.25,active.a+.8))*(1-ramp(time,active.b-.55,active.b)));
 }else if(time>=30){screen.classList.add("overview");page.style.transform="scale(1) translateY(0)";info.style.opacity=0;focus.style.opacity=0}
 // Octo stays in a consistent anchor position; body floats, arms gesture, eyes look toward the active focus.
 const op=out(ramp(time,1.4,2.7))*(1-ramp(time,33.3,34.1));octo.style.opacity=op;
 const bob=Math.sin(time*1.25)*5,tilt=Math.sin(time*.8)*1.3,gesture=active?1:0;
 octo.style.transform="translate3d(0,"+bob+"px,0) rotate("+tilt+"deg) scale("+(1+Math.sin(time*1.6)*.008)+")";
 const armAmp=active?1.25:.65;
 limbs.forEach(l=>{const wave=Math.sin(time*1.9+l.phase)*2.2*armAmp+Math.sin(time*3.1+l.phase)*.6;l.node.setAttribute("transform","rotate("+(wave*l.dir)+" "+l.x+" 308.65)")});
 const gaze=active?active.gaze:[.25,-.15];pupils.forEach(p=>p.setAttribute("transform","translate("+(gaze[0]*7)+" "+(gaze[1]*6)+")"));
 let blink=1;for(const bt of [3.8,7.9,11.7,15.5,19.3,23.1,27.2,31.1]){const q=(time-bt)/.15;if(q>0&&q<1)blink=Math.min(blink,1-.94*Math.sin(Math.PI*q))}
 eyes.forEach((e,i)=>{const x=i?302.82:114.81;e.setAttribute("transform","translate("+x+" 157.74) scale(1 "+blink+") translate("+(-x)+" -157.74)")});
 $("mSurprise").style.opacity=(time>4.5&&time<7)?1:0;$("mHappy").style.opacity=(time>7&&time<33)?1:1;
 const end=out(ramp(time,30.4,31.5));closing.style.opacity=end;closing.style.transform="translateY("+lerp(30,0,end)+"px)";
 $("scrub").value=time;$("time").textContent=time.toFixed(2)+"s";
}
window.renderAt=draw;window.OCTO_META={duration:D,fps:30,width:1080,height:1920};window.OCTO_EVENTS=[{name:"rise",t:1.6},{name:"whoosh",t:4.2},{name:"pop",t:7.1},{name:"sweep",t:13},{name:"sweep",t:19},{name:"pop",t:25},{name:"ding",t:30.8}];
const ready=()=>{if(page.complete&&page.naturalWidth){pageHeight=page.getBoundingClientRect().height;screenHeight=screen.clientHeight;draw(time)}else page.addEventListener("load",()=>{pageHeight=page.getBoundingClientRect().height;screenHeight=screen.clientHeight;draw(time)},{once:true})};document.fonts.ready.then(ready);ready();
function tick(){if(!playing)return;const t=Math.min(D,(performance.now()-start)/1000);draw(t);if(t>=D){playing=false;$("play").textContent="Play";return}raf=requestAnimationFrame(tick)}
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Play";if(playing){start=performance.now()-time*1000;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};
$("restart").onclick=()=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(0)};
$("scrub").oninput=e=>{playing=false;cancelAnimationFrame(raf);$("play").textContent="Play";draw(+e.target.value)};
addEventListener("resize",()=>{screenHeight=screen.clientHeight;draw(time)});draw(0);
})();
</script></body></html>

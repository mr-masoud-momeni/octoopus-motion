<script>
(()=>{
const RENDER=new URLSearchParams(location.search).has("render"),DURATION=7.5,FPS=30,$=s=>document.querySelector(s);

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,p)=>a+(b-a)*p,prog=(t,a,d)=>clamp((t-a)/d),out=p=>1-Math.pow(1-p,3),inOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;

const bubbles=[],random=rng(241019);
for(let i=0;i<22;i++){const node=document.createElement("i"),size=8+random()*30;node.style.width=size+"px";node.style.height=size+"px";el.bubbles.appendChild(node);bubbles.push({node,x:30+random()*1020,y:random()*2050,speed:32+random()*90,phase:random()*Math.PI*2,drift:12+random()*35,alpha:.12+random()*.26})}
const blinks=[1.05,2.85,4.05,5.85,6.75],CX=212.6,CY=471.93;
function blinkAt(t){let sy=1;for(const b of blinks){const p=(t-b)/.17;if(p>0&&p<1)sy=Math.min(sy,1-.94*Math.sin(Math.PI*p))}return sy}
function draw(t){
t=clamp(Number(t)||0,0,DURATION);el.grid.style.transform=`translate(${Math.sin(t*.22)*12}px,${-t*7}px)`;el.halo.style.transform=`scale(${1+Math.sin(t*.9)*.018})`;el.halo.style.opacity=.75+Math.sin(t*.9)*.08;
bubbles.forEach(b=>{const y=2000-((b.y+t*b.speed)%2200),x=b.x+Math.sin(t*.72+b.phase)*b.drift;b.node.style.transform=`translate(${x}px,${y}px)`;b.node.style.opacity=b.alpha*(.72+.28*Math.sin(t*1.2+b.phase))});
const rise=out(prog(t,.05,1.05)),y=lerp(720,0,rise),breath=t<1.1?0:Math.sin((t-1.1)*1.55)*3.2,squash=.018*Math.sin(Math.PI*prog(t,.92,.48))*(t<1.45?1:0);

[["legLL",31.89,-1,0],["legLM",152.34,-.7,.7],["legRM",272.93,.7,1.4],["legRL",393.3,1,2.1]].forEach(([id,pivot,dir,phase])=>{const a=Math.sin(t*(t<.9?4:1.45)+phase)*(t<.9?1.1:1.4);$("#"+id).setAttribute("transform",`rotate(${(a*dir).toFixed(2)} ${pivot} 308.65)`)});
const look=inOut(prog(t,2.1,.5)),gx=lerp(-1.5,2.6,look)+Math.sin(t*.65)*1.2,gy=lerp(0,-1.2,look)+Math.sin(t*.8)*.7;
el.pupilL.setAttribute("transform",`translate(${gx.toFixed(2)} ${gy.toFixed(2)})`);el.pupilR.setAttribute("transform",`translate(${gx.toFixed(2)} ${gy.toFixed(2)})`);
const blink=blinkAt(t);[["eyeL",114.81,157.74],["eyeR",302.82,157.74]].forEach(([id,x,y])=>$("#"+id).setAttribute("transform",`translate(${x} ${y}) scale(1 ${blink.toFixed(3)}) translate(${-x} ${-y})`));
const surprise=1-prog(t,.25,.24),happy=prog(t,.85,.35);el.surprise.style.opacity=clamp(surprise);el.happy.style.opacity=clamp(happy);el.sad.style.opacity=0;

}

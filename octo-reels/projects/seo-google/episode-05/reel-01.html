<link rel="stylesheet" href="../../../template/fonts.css">
<style>
:root{--bg:#071426;--panel:#10243d;--cyan:#41faf1;--white:#f4f7fb;--muted:#b7c5d7;--red:#ff6477;--green:#7df2c4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030914}
body{font-family:Vazirmatn,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;overflow:hidden;transform-origin:center;background:radial-gradient(90% 70% at 50% 62%,#153653 0%,#071426 58%,#030914 100%);isolation:isolate}
#stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(65,250,241,.12) 2px,transparent 2px);background-size:68px 68px;opacity:.3;mask-image:radial-gradient(70% 60% at 50% 52%,#000,transparent)}
#stage:after{content:"";position:absolute;width:900px;height:900px;left:90px;top:480px;border-radius:50%;background:#123b52;filter:blur(130px);opacity:.22;pointer-events:none}
.brand{position:absolute;top:62px;left:0;right:0;text-align:center;direction:ltr;font:800 24px/1 system-ui,sans-serif;letter-spacing:.12em;color:#9eafc3;opacity:.72;z-index:20}
.brand:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cyan);margin-right:12px;box-shadow:0 0 16px var(--cyan)}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:2}
.scene-title{position:absolute;top:210px;left:75px;right:75px;text-align:center;font-size:68px;line-height:1.55;font-weight:1000;letter-spacing:-.04em;text-shadow:0 10px 32px #0008}
.scene-title em{font-style:normal;color:var(--cyan)}
.type-caret{display:inline-block;width:5px;height:.95em;background:var(--cyan);vertical-align:-.08em;margin-right:7px;animation:blink .7s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.octo{position:absolute;width:420px;height:466px;left:330px;top:1050px;opacity:0;filter:drop-shadow(0 18px 25px #0007) drop-shadow(0 0 18px #41faf122);z-index:5}
.octo svg{width:100%;height:100%;overflow:visible}
.octo-body{fill:#41faf1}.octo-ring{fill:#071426}.octo-pupil{fill:#03080f}.octo-shine{fill:#fff}
#hookOcto{top:1120px;transform:translateY(80px) rotate(-5deg)}
#endOcto{top:1120px;transform:translateY(450px)}
.sick-bubble{position:absolute;top:1040px;left:690px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:#caff9c;color:#153c39;font-size:70px;box-shadow:0 0 45px #9cf7a566;opacity:0;transform:scale(.2) rotate(-25deg);z-index:6}
#hookCaption{position:absolute;top:750px;left:65px;right:65px;text-align:center;font-size:84px;line-height:1.55;font-weight:1000;opacity:0}
#hookCaption em{font-style:normal;color:var(--cyan)}
#hookCaption small{display:block;font-size:29px;color:#c2d1df;margin-top:22px;font-weight:700}
.scene2-title{top:185px;font-size:61px}
.aquarium{position:absolute;top:470px;left:74px;right:74px;height:1050px;border:3px solid #41faf155;border-radius:42px;background:linear-gradient(155deg,#0c2b43dd,#07182bdd);box-shadow:0 28px 90px #0007,inset 0 0 70px #41faf10b;overflow:hidden}
.aquarium:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#41faf11b,transparent 58%);pointer-events:none}
.tank-label{position:absolute;top:36px;left:45px;right:45px;text-align:center;color:#b6c8d9;font-size:25px;font-weight:850;letter-spacing:.01em}
.tank-label strong{color:var(--cyan)}
.seaweed{position:absolute;bottom:-15px;left:28px;font-size:100px;opacity:.65;transform:rotate(-12deg)}
.seaweed.right{left:auto;right:25px;transform:rotate(12deg)}
.page-list{position:absolute;top:150px;left:55px;right:55px;display:flex;flex-direction:column;gap:22px}
.page-row{height:142px;border-radius:24px;background:linear-gradient(110deg,#f4f8fb,#dce8ef);color:#16324c;display:flex;align-items:center;padding:18px 25px;gap:20px;box-shadow:0 12px 25px #0003;opacity:0;transform:translateY(25px)}
.page-row .page-icon{font-size:53px;width:76px;flex:none;text-align:center;filter:drop-shadow(0 5px 4px #0002)}
.page-row .page-copy{flex:1;text-align:right}
.page-row .page-copy strong{display:block;font-size:32px;line-height:1.5;font-weight:1000}
.page-row .page-copy small{display:block;font-size:20px;color:#62758a;margin-top:4px}
.stamp{width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:43px;font-weight:1000;opacity:0;transform:scale(.2) rotate(-25deg)}
.approved .stamp{background:#d7fff0;color:#098d67;border:4px solid #20ba8c}
.rejected{border:4px solid #ff697b;background:linear-gradient(110deg,#fff4f4,#f9e3e6)}
.rejected .stamp{background:#ffe1e5;color:#d52d4b;border:4px solid #ef5b72}
.crab-guard{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:72px;opacity:0}
.guard-sign{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:10px 24px;border:2px solid #ff7383;border-radius:15px;background:#421f35;color:#ffe5e8;font-size:23px;font-weight:900;opacity:0}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bubbles i{position:absolute;width:15px;height:15px;border:2px solid #9efaf2aa;border-radius:50%;animation:float 4s ease-in-out infinite}
.bubbles i:nth-child(1){left:8%;top:20%}.bubbles i:nth-child(2){left:90%;top:34%;animation-delay:-1.2s}.bubbles i:nth-child(3){left:15%;top:72%;animation-delay:-2.2s}.bubbles i:nth-child(4){left:82%;top:80%;animation-delay:-.6s}
@keyframes float{50%{transform:translateY(-30px);opacity:.4}}
.scene3-title{top:155px;font-size:61px}
.reason-stack{position:absolute;top:420px;left:78px;right:78px;display:flex;flex-direction:column;gap:22px}
.reason-card{min-height:250px;display:flex;align-items:center;gap:24px;padding:26px 30px;border:2px solid #2b5268;border-radius:28px;background:linear-gradient(115deg,#102b43ed,#0a1d32f2);box-shadow:0 20px 45px #0005;opacity:0;transform:translateX(45px)}
.creature{width:116px;height:116px;flex:none;border-radius:34px;background:#173e53;display:grid;place-items:center;font-size:72px;box-shadow:inset 0 0 0 2px #41faf144}
.reason-copy{flex:1;text-align:right}
.reason-copy strong{display:block;font-size:39px;line-height:1.5;font-weight:1000;color:#fff}
.reason-copy p{font-size:24px;line-height:1.7;color:#b8c8d8;margin-top:8px}
.reason-copy strong em{font-style:normal;color:var(--cyan)}
.reason-foot{position:absolute;top:1515px;left:95px;right:95px;text-align:center;font-size:27px;color:#b7c9d9;opacity:0}
.scene4-title{top:390px;font-size:74px;min-height:330px}
.scene4-title small{display:block;font-size:29px;line-height:1.8;color:#c4d2df;margin-top:28px;font-weight:700}
#controls{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:16px 22px;background:rgba(5,12,24,.97);border-top:1px solid rgba(65,250,241,.25);font:16px ui-monospace,Consolas,monospace;color:#cbd5e1;direction:ltr}
#controls button{background:#102a43;color:var(--cyan);border:1px solid rgba(65,250,241,.4);border-radius:11px;padding:11px 17px;font:inherit;cursor:pointer}
#scrub{flex:1;accent-color:var(--cyan);height:12px}#time{min-width:82px;text-align:center}
</style></head>

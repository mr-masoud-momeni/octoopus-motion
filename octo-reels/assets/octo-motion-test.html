<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octo — Motion Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071321;color:#eaf7f7;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center}
main{width:min(92vw,760px);text-align:center;padding:32px 18px}.stage{height:min(72vh,650px);min-height:430px;display:grid;place-items:center;position:relative}
svg{height:100%;max-width:100%;filter:drop-shadow(0 18px 35px #0005)}
#charInner{transform-box:fill-box;transform-origin:50% 55%;animation:bodyIdle 4s ease-in-out infinite}
#legLL,#legLM,#legRM,#legRL{transform-box:fill-box;transform-origin:50% 0%;transition:transform .45s cubic-bezier(.2,.75,.25,1)}
#pupilL,#pupilR{transform-box:fill-box;transform-origin:center;transition:transform .35s ease}
#brows path{fill:none;stroke:#08283b;stroke-width:13;stroke-linecap:round;opacity:.9;transition:transform .35s ease}
#mouth #mHappy{opacity:1}#mouth #mSurprise,#mouth #mSad{opacity:0}
svg.wave #legRL{transform:rotate(-38deg)}svg.wave #legRM{transform:rotate(-10deg)}
svg.wave #pupilL,svg.wave #pupilR{transform:translate(5px,-2px)}
svg.wave #browL{transform:translateY(-7px) rotate(-7deg);transform-origin:center}
svg.surprise #mHappy{opacity:0}svg.surprise #mSurprise{opacity:1}
svg.surprise #browL{transform:translateY(-12px)}svg.surprise #browR{transform:translateY(-12px)}
svg.look #pupilL,svg.look #pupilR{transform:translate(13px,4px)}
@keyframes bodyIdle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(.6deg)}}
.caption{font-size:clamp(17px,3vw,22px);margin:10px 0 22px;color:#41faf1}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:1px solid #41faf1;background:transparent;color:#eaf7f7;border-radius:999px;padding:11px 20px;font-size:15px;cursor:pointer}
button:hover,button.active{background:#41faf1;color:#071321}
.note{font-size:12px;color:#91a6b5;margin-top:18px}

    .octo-rig{overflow:visible}

<button data-action="idle" class="active">حالت عادی</button><button data-action="wave">دست تکان دادن</button><button data-action="look">نگاه کردن</button><button data-action="surprise">تعجب</button>
</div><div class="note">نمونه‌ی اولیه‌ی قابلیت‌های حرکتی — برای تست، دکمه‌ها را بزن.</div></main>
<script>
const svg=document.querySelector('svg'),caption=document.querySelector('#caption'),buttons=[...document.querySelectorAll('button')];
const labels={idle:'سلام! من اکتو هستم 👋',wave:'هی! اینجام! 👋',look:'اوه؟ اون‌طرف چه خبره؟',surprise:'وای! 😮'};
function set(action){svg.classList.remove('wave','look','surprise');if(action!=='idle')svg.classList.add(action);caption.textContent=labels[action];buttons.forEach(b=>b.classList.toggle('active',b.dataset.action===action))}
buttons.forEach(b=>b.addEventListener('click',()=>set(b.dataset.action)));
setTimeout(()=>set('wave'),1800);setTimeout(()=>set('look'),4400);setTimeout(()=>set('surprise'),6500);setTimeout(()=>set('idle'),8200);
</script></body></html>
